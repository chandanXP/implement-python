<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Interactive Python Handbook</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>

    <!-- Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.4/full/pyodide.js"></script>

    <!-- Particles.js -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;800&display=swap');

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        h1, h2, h3 { font-weight: 800; }
        code { font-family: 'Fira Code', monospace; background: #1e293b; padding: 0.2rem 0.4rem; border-radius: 0.25rem; color: #38bdf8; }
        pre { background: #1e293b; padding: 10px; border-radius: 5px; overflow-x: auto; border: 1px solid #334155; }
        pre code { background: transparent; padding: 0; color: #e2e8f0; }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Fixed CodeMirror height issue */
        .CodeMirror {
            height: 100% !important;
            width: 100% !important;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 0.5rem;
            font-size: 15px;
            font-family: 'Fira Code', monospace;
            border: 1px solid #334155;
        }

        .locked { opacity: 0.4; cursor: not-allowed; filter: grayscale(100%); pointer-events: none; }
        .active-chapter { background: rgba(56, 189, 248, 0.15); border-left: 4px solid #38bdf8; color: #38bdf8; font-weight: 600; }

        .console-output {
            font-family: 'Fira Code', monospace;
            background: #000000;
            color: #4ade80;
            padding: 10px;
            border-radius: 0.5rem;
            overflow-y: auto;
            border: 1px solid #334155;
            white-space: pre-wrap;
        }

        .console-maximized {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            z-index: 9999;
            height: 100vh !important;
            border-radius: 0 !important;
            background: #0f172a !important;
            display: flex;
            flex-direction: column;
            padding: 20px !important;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <div id="particles-js"></div>

    <!-- Top Navigation Bar -->
    <nav class="h-14 glass-panel z-20 flex items-center justify-between px-4 border-b border-slate-700 shrink-0">
        <div class="flex items-center gap-4">
            <button id="toggle-sidebar-btn" class="text-slate-300 hover:text-white transition-colors p-2 rounded hover:bg-slate-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <div class="flex items-center gap-2">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c3/Python-logo-notext.svg" alt="Python" class="w-6 h-6">
                <h1 class="text-lg font-bold text-white tracking-wide hidden sm:block">Ultimate Handbook</h1>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <button id="toggle-theory-btn" class="text-xs font-bold bg-slate-800 hover:bg-slate-700 text-cyan-400 px-3 py-1.5 rounded border border-slate-600 transition flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>

            <div class="flex bg-slate-800 rounded p-1 border border-slate-600">

                <button id="lang-hi" class="px-3 py-1 text-xs font-bold rounded text-slate-400 hover:text-white transition-all">हिंदी</button>

        </div>
    </nav>

    <div class="flex flex-grow overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-72 glass-panel h-full p-4 overflow-y-auto z-10 flex flex-col border-r border-slate-700 transition-all duration-300 shrink-0">
            <nav id="sidebar-nav" class="flex-grow space-y-1 text-sm"></nav>
            <div class="mt-4 pt-4 border-t border-slate-700 shrink-0">
                <div class="flex justify-between items-center mb-2">
                    <span id="progress-label" class="text-xs text-slate-400 uppercase tracking-wider font-bold">Your Progress</span>
                    <span id="progress-text" class="text-xs font-bold text-cyan-400">0%</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-cyan-400 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <button id="reset-btn" class="mt-4 text-xs text-red-400 hover:text-red-300 transition-colors w-full text-left" data-en="Reset Progress" data-hi="प्रगति रीसेट करें">Reset Progress</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-grow h-full p-4 overflow-hidden z-10 flex flex-col transition-all duration-300">
            <header class="mb-4 flex justify-between items-end border-b border-slate-700 pb-2 shrink-0">
                <div>
                    <h2 id="lesson-title" class="text-2xl font-bold text-white mb-1">Loading...</h2>
                    <p id="lesson-description" class="text-slate-400 text-xs">Please wait while the environment initializes.</p>
                </div>
                <span id="chapter-badge" class="bg-slate-800 text-cyan-400 text-xs px-3 py-1 rounded-full border border-cyan-900 font-bold shrink-0 ml-4">CH 0</span>
            </header>

            <div class="flex flex-col xl:flex-row gap-4 flex-grow overflow-hidden h-full">
                
                <!-- Theory Panel -->
                <div id="theory-panel" class="w-full xl:w-5/12 glass-panel p-4 rounded-xl overflow-y-auto flex flex-col fade-in transition-all duration-300 shrink-0">
                    <div id="theory-content" class="prose prose-invert max-w-none text-slate-300 text-sm leading-relaxed mb-4"></div>
                    
                    <div class="mt-auto bg-slate-800 p-3 rounded-lg border border-slate-600 shrink-0">
                        <div class="flex items-center gap-2 mb-1">
                            <svg class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            <h3 id="task-label" class="text-sm font-bold text-yellow-400">Current Task</h3>
                        </div>
                        <p id="task-description" class="text-xs text-slate-300 font-medium"></p>
                        <div class="mt-2 text-[10px] text-slate-500">
                            <span data-en="Expected Output:" data-hi="अपेक्षित आउटपुट:">Expected Output:</span> 
                            <code id="expected-output-display" class="text-green-400 bg-black px-1 rounded"></code>
                        </div>
                    </div>
                </div>

                <!-- Editor & Console Wrapper -->
                <div class="w-full flex-grow flex flex-col gap-4 overflow-hidden h-full">
                    
                    <div class="glass-panel p-3 rounded-xl flex-grow flex flex-col overflow-hidden relative">
                        <div class="flex justify-between items-center mb-2 shrink-0">
                            <div class="flex gap-1.5 items-center">
                                <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-yellow-500"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-green-500"></span>
                                <span class="text-xs text-slate-400 ml-2 font-mono">main.py</span>
                            </div>
                            <button id="run-btn" class="bg-slate-700 hover:bg-slate-600 text-cyan-400 px-3 py-1 rounded text-xs font-bold transition flex items-center gap-1 border border-slate-600">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Run Code
                            </button>
                        </div>
                        <div class="flex-grow overflow-hidden relative">
                            <textarea id="code-editor"></textarea>
                        </div>
                    </div>

                    <div id="console-panel" class="glass-panel p-3 rounded-xl h-56 flex flex-col shrink-0 transition-all duration-300">
                        <div class="flex justify-between items-center mb-1 shrink-0">
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider" data-en="Terminal Output" data-hi="टर्मिनल आउटपुट">Terminal Output</span>
                            <div class="flex gap-3">
                                <button id="maximize-console-btn" class="text-[10px] text-cyan-400 hover:text-cyan-300 font-bold transition-colors" data-en="Maximize" data-hi="बड़ा करें">Maximize</button>
                                <button id="clear-console" class="text-[10px] text-slate-500 hover:text-slate-300 transition-colors" data-en="Clear" data-hi="साफ़ करें">Clear</button>
                            </div>
                        </div>
                        <div id="console" class="console-output flex-grow text-xs mb-2 overflow-y-auto">> Initializing Pyodide... Please wait.</div>
                        <button id="submit-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-2 rounded font-bold text-sm transition disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-cyan-900/50 flex justify-center items-center gap-2 shrink-0" disabled>
                            <span data-en="Loading Python Environment..." data-hi="पायथन वातावरण लोड हो रहा है...">Loading Python Environment...</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ============================================================================
        // 1. CURRICULUM DATA (Fully Expanded and Fixed Syntax)
        // ============================================================================
        const curriculum = [
            {
                id: "ch1",
                title: "Ch 1: Modules, Comments & pip",
                title_hi: "अध्याय 1: मॉड्यूल, टिप्पणियाँ और pip",
                description: "Learn the basics of Python, how to write comments, and use modules.",
                description_hi: "पायथन की मूल बातें सीखें, टिप्पणियाँ कैसे लिखें और मॉड्यूल का उपयोग कैसे करें।",
                theory: `
                    <h3 class="text-lg font-bold text-white mt-2">1. What is Programming?</h3>
                    <p>Programming is a way to instruct the computer to perform various tasks. Just like we use Hindi or English to communicate with each other, we use a programming language like Python to communicate with the computer.</p>
                    
                    <h3 class="text-lg font-bold text-white mt-4">2. What is Python & Features?</h3>
                    <p>Python is a simple and easy-to-understand language which feels like reading simple English. </p>
                    <ul class="list-disc pl-5 mt-1 space-y-1">
                        <li>Easy to understand = Less development time</li>
                        <li>Free and open source</li>
                        <li>High level language</li>
                        <li>Portable: Works on Linux / Windows / Mac.</li>
                    </ul>

                    <h3 class="text-lg font-bold text-white mt-4">3. Modules & pip</h3>
                    <p>A <strong>module</strong> is a file containing code written by somebody else (usually) which can be imported and used in our programs. <strong>pip</strong> is the package manager for python. You can use pip to install an external module on your system.</p>
                    <pre><code>pip install flask # Installs Flask Module</code></pre>
                    <p><strong>Types of Modules:</strong> 1. Built-in (os, random), 2. External (tensorflow, flask).</p>
                    
                    <h3 class="text-lg font-bold text-white mt-4">4. Comments</h3>
                    <p>Comments are used to write something which the programmer does not want to execute. This can be used to mark author name, date etc.</p>
                    <ul class="list-disc pl-5 mt-1 space-y-1">
                        <li><strong>Single Line:</strong> Start with <code>#</code>.</li>
                        <li><strong>Multiline:</strong> Use triple quotes <code>"""</code> or <code>'''</code>.</li>
                    </ul>
                `,
                theory_hi: `
                    <h3 class="text-lg font-bold text-white mt-2">1. प्रोग्रामिंग क्या है?</h3>
                    <p>प्रोग्रामिंग कंप्यूटर को विभिन्न कार्य करने का निर्देश देने का एक तरीका है।</p>
                    <h3 class="text-lg font-bold text-white mt-4">2. पायथन क्या है और विशेषताएँ?</h3>
                    <p>पायथन एक सरल और समझने में आसान भाषा है। यह मुफ़्त और ओपन सोर्स है, और हर ऑपरेटिंग सिस्टम पर चलती है।</p>
                    <h3 class="text-lg font-bold text-white mt-4">3. मॉड्यूल और pip</h3>
                    <p><strong>मॉड्यूल</strong> किसी और द्वारा लिखे गए कोड वाली एक फाइल है। <strong>pip</strong> पैकेज मैनेजर है जिससे हम बाहरी मॉड्यूल इंस्टॉल करते हैं।</p>
                    <h3 class="text-lg font-bold text-white mt-4">4. टिप्पणियाँ (Comments)</h3>
                    <p>कोड को समझाने के लिए टिप्पणियाँ लिखी जाती हैं जो रन नहीं होतीं।</p>
                `,
                task: "Write a Python program to print 'Twinkle twinkle little star' and include a single-line comment above it.",
                task_hi: "एक पायथन प्रोग्राम लिखें जो 'Twinkle twinkle little star' प्रिंट करे और इसके ऊपर एक सिंगल-लाइन टिप्पणी शामिल करें।",
                expectedOutput: "Twinkle twinkle little star",
                starterCode: "# This is a comment\nprint('Twinkle twinkle little star')"
            },
            {
                id: "ch2",
                title: "Ch 2: Variables & Data Types",
                title_hi: "अध्याय 2: वेरिएबल्स और डेटा टाइप्स",
                description: "Master variables, data types, operators, and user input.",
                description_hi: "वेरिएबल्स, डेटा टाइप्स, ऑपरेटर और यूजर इनपुट में महारत हासिल करें।",
                theory: `
                    <h3 class="text-lg font-bold text-white mt-2">1. Variables & Rules for Identifiers</h3>
                    <p>A variable is the name given to a memory location in a program.</p>
                    <p><strong>Rules:</strong> Can contain alphabets, digits, underscores. Must start with alphabet or underscore. No whitespaces allowed.</p>
                    <h3 class="text-lg font-bold text-white mt-4">2. Data Types</h3>
                    <p>Python automatically identifies the data type.</p>
                    <ul class="list-disc pl-5 mt-1 space-y-1">
                        <li>Integers (int) - e.g., <code>71</code></li>
                        <li>Floating point (float) - e.g., <code>88.44</code></li>
                        <li>Strings (str) - e.g., <code>"harry"</code></li>
                        <li>Booleans (bool) - <code>True</code> or <code>False</code></li>
                        <li>None</li>
                    </ul>
                    <h3 class="text-lg font-bold text-white mt-4">3. Operators</h3>
                    <p>Arithmetic (+, -, *, /), Assignment (=, +=), Comparison (==, >=, <=), Logical (and, or, not).</p>
                    <h3 class="text-lg font-bold text-white mt-4">4. Type Casting & Input</h3>
                    <p><code>type()</code> checks type. <code>int()</code>, <code>float()</code>, <code>str()</code> convert types. <code>input()</code> always returns a string.</p>
                `,
                theory_hi: `
                    <h3 class="text-lg font-bold text-white mt-2">1. वेरिएबल्स</h3>
                    <p>वेरिएबल मेमोरी लोकेशन का नाम है। इसमें अक्षर, अंक और अंडरस्कोर हो सकते हैं।</p>
                    <h3 class="text-lg font-bold text-white mt-4">2. डेटा टाइप्स</h3>
                    <p>मुख्य रूप से: इंटीजर (int), फ्लोट (float), स्ट्रिंग (str), बूलियन (bool), और None।</p>
                    <h3 class="text-lg font-bold text-white mt-4">3. ऑपरेटर्स</h3>
                    <p>अंकगणितीय (+, -, *, /), असाइनमेंट (=, +=), तुलना (==, >=, <=)।</p>
                    <h3 class="text-lg font-bold text-white mt-4">4. टाइप कास्टिंग और इनपुट</h3>
                    <p><code>type()</code> से टाइप पता करें। <code>input()</code> कीबोर्ड से इनपुट लेता है (हमेशा स्ट्रिंग के रूप में)।</p>
                `,
                task: "Write a python program to find remainder when a number (a=10) is divided by z (z=3).",
                task_hi: "जब एक संख्या (a=10) को z (z=3) से विभाजित किया जाता है तो शेषफल ज्ञात करने के लिए एक पायथन प्रोग्राम लिखें।",
                expectedOutput: "1",
                starterCode: "a = 10\nz = 3\n# Find remainder using %\nprint(a % z)"
            },
            {
                id: "ch3",
                title: "Ch 3: Strings",
                title_hi: "अध्याय 3: स्ट्रिंग्स",
                description: "Explore string slicing, functions, and escape sequences.",
                description_hi: "स्ट्रिंग स्लाइसिंग, फ़ंक्शंस और एस्केप सीक्वेंस का पता लगाएं।",
                theory: `
                    <h3 class="text-lg font-bold text-white mt-2">1. String Slicing</h3>
                    <p>A string can be sliced to get a part of it. Syntax: <code>name[start:end]</code> (end is exclusive).</p>
                    <p>Negative indices can also be used: <code>-1</code> is the last character.</p>
                    <h3 class="text-lg font-bold text-white mt-4">2. String Functions</h3>
                    <ul class="list-disc pl-5 mt-1 space-y-1">
                        <li><code>len(str)</code> - Length of string</li>
                        <li><code>str.endswith("rry")</code> - Checks suffix</li>
                        <li><code>str.count("r")</code> - Counts occurrences</li>
                        <li><code>str.capitalize()</code> - Capitalizes first letter</li>
                        <li><code>str.find(word)</code> - Finds index</li>
                        <li><code>str.replace(old, new)</code> - Replaces text</li>
                    </ul>
                    <h3 class="text-lg font-bold text-white mt-4">3. Escape Sequences</h3>
                    <p>Sequence of characters after a backslash. Examples: <code>\\n</code> (newline), <code>\\t</code> (tab), <code>\\\\</code> (backslash).</p>
                `,
                theory_hi: `
                    <h3 class="text-lg font-bold text-white mt-2">1. स्ट्रिंग स्लाइसिंग</h3>
                    <p>स्ट्रिंग का एक हिस्सा निकालने के लिए सिंटैक्स: <code>name[start:end]</code>।</p>
                    <h3 class="text-lg font-bold text-white mt-4">2. स्ट्रिंग फ़ंक्शंस</h3>
                    <p><code>len()</code>, <code>count()</code>, <code>capitalize()</code>, <code>replace()</code> आदि का उपयोग करें।</p>
                    <h3 class="text-lg font-bold text-white mt-4">3. एस्केप सीक्वेंस</h3>
                    <p>बैकस्लैश के बाद विशेष वर्ण, जैसे <code>\\n</code> (नई लाइन के लिए)।</p>
                `,

                    <h3 class="text-lg font-bold text-white mt-4">3. String Formatting</h3>
                    <p><code>join()</code> and <code>format()</code> methods.</p>
                `,
                theory_hi: `
                    <h3 class="text-lg font-bold text-white mt-2">1. लैम्ब्डा फ़ंक्शंस</h3>
                    <p>एक पंक्ति में बने अनाम फ़ंक्शंस।</p>
                    <h3 class="text-lg font-bold text-white mt-4">2. मैप, फ़िल्टर, रिड्यूस</h3>
                    <p>डेटा के संग्रह पर कार्य करने के लिए।</p>
                    <h3 class="text-lg font-bold text-white mt-4">3. स्ट्रिंग फ़ॉर्मेटिंग</h3>
                    <p><code>join()</code> और <code>format()</code>।</p>
                `,
                task: "Write a program to filter a list of numbers [2, 10, 15, 25] which are divisible by 5 and print the result.",
                task_hi: "संख्याओं की सूची [2, 10, 15, 25] में से उन संख्याओं को फ़िल्टर करने के लिए एक प्रोग्राम लिखें जो 5 से विभाज्य हैं और परिणाम प्रिंट करें।",
                expectedOutput: "[10, 15, 25]",
                starterCode: "nums = [2, 10, 15, 25]\nresult = list(filter(lambda x: x % 5 == 0, nums))\nprint(result)"
            },
            {
                id: "proj1",
                title: "Project 1: Snake, Water, Gun",
                title_hi: "प्रोजेक्ट 1: सांप, पानी, बंदूक",
                description: "Build a mini game using conditionals and random module.",
                description_hi: "कंडीशनल और रैंडम मॉड्यूल का उपयोग करके एक मिनी गेम बनाएं।",
                theory: `
                    <h3 class="text-lg font-bold text-white mt-2">Game Rules</h3>
                    <p>Snake drinks Water (Snake wins). Water drowns Gun (Water wins). Gun kills Snake (Gun wins).</p>
                    <p>Use the <code>random.choice()</code> module to let the computer make a choice.</p>
                `,
                theory_hi: `
                    <h3 class="text-lg font-bold text-white mt-2">खेल के नियम</h3>
                    <p>सांप पानी पीता है (सांप जीता)। पानी बंदूक को डुबोता है (पानी जीता)। बंदूक सांप को मारती है (बंदूक जीती)।</p>
                    <p><code>random.choice()</code> का उपयोग करें।</p>
                `,
                task: "Simulate a game where computer picks 'Snake' and you pick 'Water'. Print who wins.",
                task_hi: "एक गेम का अनुकरण करें जहाँ कंप्यूटर 'Snake' चुनता है और आप 'Water' चुनते हैं। प्रिंट करें कि कौन जीतता है।",
                expectedOutput: "Computer Wins",
                starterCode: "comp = 'Snake'\nyou = 'Water'\n# Snake wins against Water\nprint('Computer Wins')"
            },
            {
                id: "proj2",
                title: "Project 2: The Perfect Guess",
                title_hi: "प्रोजेक्ट 2: द परफेक्ट गेस",
                description: "Build a number guessing game.",
                description_hi: "एक संख्या अनुमान लगाने वाला गेम बनाएं।",
                theory: `
                    <h3 class="text-lg font-bold text-white mt-2">Game Logic</h3>
                    <p>Generate a random number. Ask the user to guess it. If they guess higher, print "Lower number please". If lower, print "Higher number please".</p>
                `,
                theory_hi: `
                    <h3 class="text-lg font-bold text-white mt-2">खेल का तर्क</h3>
                    <p>एक रैंडम संख्या उत्पन्न करें। उपयोगकर्ता से अनुमान लगाने के लिए कहें।</p>
                `,
                task: "Assume the target number is 50. You guessed 40. Print 'Higher number please'.",
                task_hi: "मान लें कि लक्ष्य संख्या 50 है। आपने 40 का अनुमान लगाया। 'Higher number please' प्रिंट करें।",
                expectedOutput: "Higher number please",
                starterCode: "target = 50\nguess = 40\nif guess < target:\n    print('Higher number please')"
            }
        ];

        // ============================================================================
        // 2. STATE & INITIALIZATION
        // ============================================================================
        let pyodide = null;
        let currentChapterIndex = 0;
        let editor;
        let completedChapters = JSON.parse(localStorage.getItem('pythonUltimateProgress')) || [];
        let isPyodideReady = false;
        
        let currentLang = 'en';
        let isSidebarOpen = true;
        let isTheoryOpen = true;
        let isConsoleMaximized = false;

        document.addEventListener("DOMContentLoaded", async () => {
            initParticles();
            initEditor();
            setupUIListeners();
            renderSidebar();
            loadChapter(0);
            await initializePyodide();
        });

        async function initializePyodide() {
            const consoleDiv = document.getElementById("console");
            const submitBtn = document.getElementById("submit-btn");
            const runBtn = document.getElementById("run-btn");

            consoleDiv.innerHTML = "> Loading Pyodide...";

            try {
                pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.27.4/full/" });
                pyodide.setStdout({ batched: (str) => { appendToConsole(str); window._pyOutput = (window._pyOutput || "") + str; } });
                pyodide.setStderr({ batched: (str) => { appendToConsole(str); window._pyOutput = (window._pyOutput || "") + str; } });
                pyodide.setStdin({ stdin: () => prompt("Python input():") });

                isPyodideReady = true;
                consoleDiv.innerHTML = "> Ready!";
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> <span>${currentLang === 'en' ? 'Validate & Complete' : 'सत्यापित करें'}</span>`;
            } catch (error) {
                consoleDiv.innerHTML = `> Error: ${error.message}`;
                submitBtn.innerHTML = "Load Failed";
            }
        }

        // ============================================================================
        // 3. UI LOGIC
        // ============================================================================
        function setupUIListeners() {
            document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));
            document.getElementById('lang-hi').addEventListener('click', () => setLanguage('hi'));

            document.getElementById('toggle-sidebar-btn').addEventListener('click', () => {
                isSidebarOpen = !isSidebarOpen;
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('-ml-72', !isSidebarOpen);
                sidebar.classList.toggle('opacity-0', !isSidebarOpen);
            });

            document.getElementById('toggle-theory-btn').addEventListener('click', () => {
                isTheoryOpen = !isTheoryOpen;
                const theoryPanel = document.getElementById('theory-panel');
                const btnText = document.getElementById('theory-btn-text');
                theoryPanel.classList.toggle('hidden', !isTheoryOpen);
                btnText.innerText = isTheoryOpen ? (currentLang === 'en' ? 'Hide Theory' : 'थ्योरी छिपाएं') : (currentLang === 'en' ? 'Show Theory' : 'थ्योरी दिखाएं');
            });

            document.getElementById('maximize-console-btn').addEventListener('click', () => {
                isConsoleMaximized = !isConsoleMaximized;
                const panel = document.getElementById('console-panel');
                const btn = document.getElementById('maximize-console-btn');
                
                if (isConsoleMaximized) {
                    panel.classList.add('console-maximized');
                    btn.innerText = currentLang === 'en' ? 'Minimize' : 'छोटा करें';
                } else {
                    panel.classList.remove('console-maximized');
                    btn.innerText = currentLang === 'en' ? 'Maximize' : 'बड़ा करें';
                }
                editor.refresh();
            });
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('lang-en').className = lang === 'en' ? "px-3 py-1 text-xs font-bold rounded bg-cyan-600 text-white" : "px-3 py-1 text-xs font-bold rounded text-slate-400 hover:text-white";
            document.getElementById('lang-hi').className = lang === 'hi' ? "px-3 py-1 text-xs font-bold rounded bg-cyan-600 text-white" : "px-3 py-1 text-xs font-bold rounded text-slate-400 hover:text-white";

            document.querySelectorAll('[data-en]').forEach(el => {
                el.innerText = el.getAttribute(`data-${lang}`);
            });

            if (isConsoleMaximized) {
                document.getElementById('maximize-console-btn').innerText = lang === 'en' ? 'Minimize' : 'छोटा करें';
            } else {
                document.getElementById('maximize-console-btn').innerText = lang === 'en' ? 'Maximize' : 'बड़ा करें';
            }

            renderSidebar();
            loadChapter(currentChapterIndex, false);
        }

        // ============================================================================
        // 4. CORE RENDERING
        // ============================================================================
        function renderSidebar() {
            const nav = document.getElementById("sidebar-nav");
            nav.innerHTML = "";

            curriculum.forEach((chapter, index) => {
                const isCompleted = completedChapters.includes(chapter.id);
                const isUnlocked = index === 0 || completedChapters.includes(curriculum[index - 1].id);
                const title = currentLang === 'hi' ? chapter.title_hi : chapter.title;

                const btn = document.createElement("button");
                btn.className = `w-full text-left px-3 py-2 rounded-lg transition-all duration-200 flex justify-between items-center group ${
                    index === currentChapterIndex ? 'active-chapter' : 'hover:bg-slate-800 text-slate-400'
                } ${!isUnlocked ? 'locked' : ''}`;

                btn.innerHTML = `
                    <span class="truncate pr-2 text-xs">${title}</span>
                    ${isCompleted ? '<span class="text-green-500 text-xs">✓</span>' : (isUnlocked ? '<span class="text-slate-600 group-hover:text-slate-400 text-xs">→</span>' : '<span class="text-slate-600 text-xs">🔒</span>')}
                `;

                if (isUnlocked) {
                    btn.onclick = () => loadChapter(index);
                }
                nav.appendChild(btn);
            });

            const percent = Math.round((completedChapters.length / curriculum.length) * 100);
            document.getElementById("progress-text").innerText = percent + "%";
            document.getElementById("progress-bar").style.width = percent + "%";
        }

        function loadChapter(index, resetCode = true) {
            currentChapterIndex = index;
            const chapter = curriculum[index];
            
            document.getElementById("lesson-title").innerText = currentLang === 'hi' ? chapter.title_hi : chapter.title;
            document.getElementById("lesson-description").innerText = currentLang === 'hi' ? chapter.description_hi : chapter.description;
            document.getElementById("chapter-badge").innerText = `CH ${index}`;
            document.getElementById("theory-content").innerHTML = currentLang === 'hi' ? chapter.theory_hi : chapter.theory;
            document.getElementById("task-description").innerText = currentLang === 'hi' ? chapter.task_hi : chapter.task;
            document.getElementById("expected-output-display").innerText = chapter.expectedOutput.replace(/\n/g, '\\n');

            if (resetCode) {
                editor.setValue(chapter.starterCode);
            }

            clearConsole();
            if (isPyodideReady) appendToConsole("> Environment ready.");

            const submitBtn = document.getElementById("submit-btn");
            if (completedChapters.includes(chapter.id)) {
                submitBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span>${currentLang === 'en' ? 'Completed' : 'पूरा हुआ'}</span>`;
                submitBtn.className = "bg-green-700 text-white px-3 py-2 rounded font-bold text-sm shadow-lg flex justify-center items-center gap-2 cursor-default mt-2 shrink-0";
            } else {
                submitBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> <span>${currentLang === 'en' ? 'Validate & Complete' : 'सत्यापित करें और पूरा करें'}</span>`;
                submitBtn.className = "bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-2 rounded font-bold text-sm transition shadow-lg shadow-cyan-900/50 flex justify-center items-center gap-2 mt-2 shrink-0";
            }

            // Refresh editor to fix any layout glitches when switching chapters
            setTimeout(() => editor.refresh(), 10);

            renderSidebar();
        }

        // ============================================================================
        // 5. PYODIDE EXECUTION
        // ============================================================================
        async function runPythonCode() {
            if (!isPyodideReady) return "";
            const code = editor.getValue();
            window._pyOutput = "";
            clearConsole();
            appendToConsole("> Executing main.py...\n");

            try {
                await pyodide.runPythonAsync(code);
            } catch (err) {
                appendToConsole(`\n[Error]: ${err.message}`);
                window._pyOutput += `[Error]: ${err.message}`;
            }
            return window._pyOutput || "";
        }

        function appendToConsole(text) {
            const consoleDiv = document.getElementById("console");
            consoleDiv.innerHTML += text.replace(/\n/g, "<br>");
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function clearConsole() {
            document.getElementById("console").innerHTML = "";
        }

        // ============================================================================
        // 6. HELPERS & LISTENERS
        // ============================================================================
        function initParticles() {
            particlesJS("particles-js", {
                "particles": { "number": { "value": 60 }, "color": { "value": "#38bdf8" }, "shape": { "type": "circle" }, "opacity": { "value": 0.2 }, "size": { "value": 3 }, "line_linked": { "enable": true, "distance": 150, "color": "#38bdf8", "opacity": 0.2, "width": 1 }, "move": { "enable": true, "speed": 1.5 } },
                "interactivity": { "events": { "onhover": { "enable": true, "mode": "grab" } } },
                "retina_detect": true
            });
        }

        function initEditor() {
            editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
                mode: "python", theme: "dracula", lineNumbers: true, indentUnit: 4, autoCloseBrackets: true, matchBrackets: true
            });
        }

        document.getElementById("run-btn").addEventListener("click", async () => {
            if (isPyodideReady) await runPythonCode();
        });

        document.getElementById("clear-console").addEventListener("click", () => clearConsole());

        document.getElementById("submit-btn").addEventListener("click", async () => {
            if (!isPyodideReady) return;
            const chapter = curriculum[currentChapterIndex];
            const output = await runPythonCode();
            
            const cleanOutput = output.trim().replace(/\r\n/g, '\n');
            const expected = chapter.expectedOutput.trim().replace(/\r\n/g, '\n');

            if (cleanOutput === expected) {
                appendToConsole("\n\n✅ SUCCESS!");
                if (!completedChapters.includes(chapter.id)) {
                    completedChapters.push(chapter.id);
                    localStorage.setItem('pythonUltimateProgress', JSON.stringify(completedChapters));
                }
                renderSidebar();
                if (currentChapterIndex + 1 < curriculum.length) {
                    setTimeout(() => {
                        alert(currentLang === 'en' ? "🎉 Correct! Moving to next chapter." : "🎉 सही! अगले अध्याय पर जा रहे हैं।");
                        loadChapter(currentChapterIndex + 1);
                    }, 500);
                }
            } else {
                appendToConsole("\n\n❌ ERROR: Output mismatch.");
                appendToConsole(`\nExpected: "${expected}"`);
                appendToConsole(`\nGot:      "${cleanOutput}"`);
            }
        });

        document.getElementById("reset-btn").addEventListener("click", () => {
            if (confirm(currentLang === 'en' ? "Reset all progress?" : "प्रगति रीसेट करें?")) {
                completedChapters = [];
                localStorage.removeItem('pythonUltimateProgress');
                loadChapter(0);
            }
        });
    </script>
</body>
</html>
