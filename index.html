<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Interactive Python Handbook</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>

    <!-- Pyodide (Python in the browser) -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.4/full/pyodide.js"></script>

    <!-- Particles.js -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;800&display=swap');

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        h1, h2, h3 { font-weight: 800; }
        code { font-family: 'Fira Code', monospace; background: #1e293b; padding: 0.2rem 0.4rem; border-radius: 0.25rem; color: #38bdf8; }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .CodeMirror {
            height: 350px;
            border-radius: 0.5rem;
            font-size: 15px;
            font-family: 'Fira Code', monospace;
            border: 1px solid #334155;
        }

        .locked { opacity: 0.4; cursor: not-allowed; filter: grayscale(100%); pointer-events: none; }
        .active-chapter { background: rgba(56, 189, 248, 0.15); border-left: 4px solid #38bdf8; color: #38bdf8; font-weight: 600; }

        .console-output {
            font-family: 'Fira Code', monospace;
            background: #000000;
            color: #4ade80;
            min-height: 120px;
            padding: 15px;
            border-radius: 0.5rem;
            overflow-y: auto;
            border: 1px solid #334155;
            white-space: pre-wrap;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <div id="particles-js"></div>

    <!-- Sidebar -->
    <aside class="w-1/4 glass-panel h-full p-6 overflow-y-auto z-10 flex flex-col border-r border-slate-700">
        <div class="mb-8 flex items-center gap-3">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c3/Python-logo-notext.svg" alt="Python" class="w-8 h-8">
            <h1 class="text-xl font-bold text-white tracking-wide">Ultimate Handbook</h1>
        </div>
        <nav id="sidebar-nav" class="flex-grow space-y-2 text-sm"></nav>
        <div class="mt-6 pt-6 border-t border-slate-700">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs text-slate-400 uppercase tracking-wider font-bold">Your Progress</span>
                <span id="progress-text" class="text-xs font-bold text-cyan-400">0%</span>
            </div>
            <div class="w-full bg-slate-700 rounded-full h-2.5">
                <div id="progress-bar" class="bg-cyan-400 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <button id="reset-btn" class="mt-4 text-xs text-red-400 hover:text-red-300 transition-colors w-full text-left">Reset Progress</button>
        </div>
    </aside>

    <!-- Main -->
    <main class="w-3/4 h-full p-8 overflow-y-auto z-10 flex flex-col">
        <header class="mb-6 flex justify-between items-end border-b border-slate-700 pb-4">
            <div>
                <h2 id="lesson-title" class="text-3xl font-bold text-white mb-2">Loading...</h2>
                <p id="lesson-description" class="text-slate-400 text-sm">Please wait while the environment initializes.</p>
            </div>
            <div class="text-right">
                <span id="chapter-badge" class="bg-slate-800 text-cyan-400 text-xs px-3 py-1 rounded-full border border-cyan-900 font-bold">CH 0</span>
            </div>
        </header>

        <div class="flex flex-col xl:flex-row gap-6 flex-grow">
            <!-- Theory -->
            <div class="w-full xl:w-5/12 glass-panel p-6 rounded-xl overflow-y-auto flex flex-col fade-in" id="theory-panel">
                <div id="theory-content" class="prose prose-invert max-w-none text-slate-300 text-sm leading-relaxed mb-8"></div>
                <div class="mt-auto bg-slate-800 p-4 rounded-lg border border-slate-600">
                    <div class="flex items-center gap-2 mb-2">
                        <svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        <h3 class="text-md font-bold text-yellow-400">Current Task</h3>
                    </div>
                    <p id="task-description" class="text-sm text-slate-300 font-medium"></p>
                    <div class="mt-2 text-xs text-slate-500">
                        Expected Output: <code id="expected-output-display" class="text-green-400"></code>
                    </div>
                </div>
            </div>

            <!-- Editor & Console -->
            <div class="w-full xl:w-7/12 flex flex-col gap-6">
                <div class="glass-panel p-4 rounded-xl flex-grow">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex gap-2">
                            <span class="w-3 h-3 rounded-full bg-red-500"></span>
                            <span class="w-3 h-3 rounded-full bg-yellow-500"></span>
                            <span class="w-3 h-3 rounded-full bg-green-500"></span>
                            <span class="text-xs text-slate-400 ml-2 font-mono">main.py</span>
                        </div>
                        <button id="run-btn" class="bg-slate-700 hover:bg-slate-600 text-cyan-400 px-4 py-1.5 rounded text-sm font-bold transition flex items-center gap-2 border border-slate-600">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Run Code
                        </button>
                    </div>
                    <textarea id="code-editor"></textarea>
                </div>

                <div class="glass-panel p-4 rounded-xl h-64 flex flex-col">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Terminal Output</span>
                        <button id="clear-console" class="text-xs text-slate-500 hover:text-slate-300">Clear</button>
                    </div>
                    <div id="console" class="console-output flex-grow font-mono text-sm">> Initializing Pyodide... Please wait.</div>
                    <button id="submit-btn" class="mt-4 bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2.5 rounded-lg font-bold transition disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-cyan-900/50 flex justify-center items-center gap-2" disabled>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Loading Python Environment...
                    </button>
                </div>
            </div>
        </div>
    </main>

        let currentChapterIndex = 0;
        let editor;
        let completedChapters = JSON.parse(localStorage.getItem('pythonUltimateProgress')) || [];
        let isPyodideReady = false;

        document.addEventListener("DOMContentLoaded", async () => {
            initParticles();
            initEditor();
            renderSidebar();
            loadChapter(0);
            await initializePyodide();
        });

        async function initializePyodide() {
            const consoleDiv = document.getElementById("console");
            const submitBtn = document.getElementById("submit-btn");
            const runBtn = document.getElementById("run-btn");

            consoleDiv.innerHTML = "> Loading Pyodide (Python runtime)...\n> This may take a few seconds on first load.";

            try {
                pyodide = await loadPyodide({
                    indexURL: "https://cdn.jsdelivr.net/pyodide/v0.27.4/full/"
                });

                // Redirect stdout to our console
                pyodide.setStdout({
                    batched: (str) => {
                        appendToConsole(str);
                        window._pyOutput = (window._pyOutput || "") + str;
                    }
                });

                // Redirect stderr (errors) to our console
                pyodide.setStderr({
                    batched: (str) => {
                        appendToConsole(str);
                        window._pyOutput = (window._pyOutput || "") + str;
                    }
                });

                // Enable input() via browser prompt
                pyodide.setStdin({
                    stdin: () => prompt("Python input() requested:")
                });

                isPyodideReady = true;
                consoleDiv.innerHTML = "> Python environment ready! Write your code and click Run.";
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Validate & Complete Chapter`;
                runBtn.disabled = false;

            } catch (error) {
                consoleDiv.innerHTML = `> Error loading Pyodide: ${error.message}\n> Please refresh the page.`;
                appendToConsole(`\n[Load Error]: ${error.message}`);
                submitBtn.innerHTML = "Pyodide Load Failed";
                runBtn.disabled = true;
            }
        }

        // ============================================================================
        // PYODIDE EXECUTION
        // ============================================================================
        async function runPythonCode() {
            if (!isPyodideReady) {
                appendToConsole("\n[Warning]: Python environment is still loading. Please wait.");
                return "";
            }

            const code = editor.getValue();
            window._pyOutput = "";

            clearConsole();
            appendToConsole("> Executing main.py...\n");

            try {
                // Run the Python code using Pyodide's async runner
                await pyodide.runPythonAsync(code);
            } catch (err) {
                // Pyodide errors are already sent to stderr, but we catch to avoid unhandled rejections
                appendToConsole(`\n[Python Error]: ${err.message}`);
                window._pyOutput += `[Python Error]: ${err.message}`;
            }

            return window._pyOutput || "";
        }

        // ============================================================================
        // UI RENDERING
        // ============================================================================
        function initParticles() {
            particlesJS("particles-js", {
                "particles": {
                    "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                    "color": { "value": "#38bdf8" },
                    "shape": { "type": "circle" },
                    "opacity": { "value": 0.2, "random": false },
                    "size": { "value": 3, "random": true },
                    "line_linked": { "enable": true, "distance": 150, "color": "#38bdf8", "opacity": 0.2, "width": 1 },
                    "move": { "enable": true, "speed": 1.5, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } },
                    "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 0.5 } } }
                },
                "retina_detect": true
            });
        }

        function initEditor() {
            editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
                mode: "python",
                theme: "dracula",
                lineNumbers: true,
                indentUnit: 4,
                autoCloseBrackets: true,
                matchBrackets: true
            });
        }

        function renderSidebar() {
            const nav = document.getElementById("sidebar-nav");
            nav.innerHTML = "";

            curriculum.forEach((chapter, index) => {
                const isCompleted = completedChapters.includes(chapter.id);
                const isUnlocked = index === 0 || completedChapters.includes(curriculum[index - 1].id);

                const btn = document.createElement("button");
                btn.className = `w-full text-left px-4 py-3 rounded-lg transition-all duration-200 flex justify-between items-center group ${
                    index === currentChapterIndex ? 'active-chapter' : 'hover:bg-slate-800 text-slate-400'
                } ${!isUnlocked ? 'locked' : ''}`;

                btn.innerHTML = `
                    <span class="truncate pr-2">${chapter.title}</span>
                    ${isCompleted ? '<span class="text-green-500">✓</span>' : (isUnlocked ? '<span class="text-slate-600 group-hover:text-slate-400">→</span>' : '<span class="text-slate-600">🔒</span>')}
                `;

                if (isUnlocked) {
                    btn.onclick = () => loadChapter(index);
                }
                nav.appendChild(btn);
            });

            const percent = Math.round((completedChapters.length / curriculum.length) * 100);
            document.getElementById("progress-text").innerText = percent + "%";
            document.getElementById("progress-bar").style.width = percent + "%";
        }

        function loadChapter(index) {
            currentChapterIndex = index;
            const chapter = curriculum[index];

            document.getElementById("lesson-title").innerText = chapter.title;
            document.getElementById("lesson-description").innerText = chapter.description;
            document.getElementById("chapter-badge").innerText = `CH ${index}`;
            document.getElementById("theory-content").innerHTML = chapter.theory;
            document.getElementById("task-description").innerText = chapter.task;
            document.getElementById("expected-output-display").innerText = chapter.expectedOutput.replace(/\n/g, '\\n');

            editor.setValue(chapter.starterCode);

            clearConsole();
            if (isPyodideReady) {
                appendToConsole("> Environment ready. Write your code and click Run.");
            }

            const submitBtn = document.getElementById("submit-btn");
            if (completedChapters.includes(chapter.id)) {
                submitBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Already Completed`;
                submitBtn.className = "mt-4 bg-green-700 text-white px-4 py-2.5 rounded-lg font-bold shadow-lg flex justify-center items-center gap-2 cursor-default";
            } else {
                submitBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Validate & Complete Chapter`;
                submitBtn.className = "mt-4 bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2.5 rounded-lg font-bold transition shadow-lg shadow-cyan-900/50 flex justify-center items-center gap-2";
            }

            const theoryPanel = document.getElementById('theory-panel');
            theoryPanel.classList.remove('fade-in');
            void theoryPanel.offsetWidth;
            theoryPanel.classList.add('fade-in');

            renderSidebar();
        }

        function appendToConsole(text) {
            const consoleDiv = document.getElementById("console");
            consoleDiv.innerHTML += text.replace(/\n/g, "<br>");
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function clearConsole() {
            document.getElementById("console").innerHTML = "";
        }

        // ============================================================================
        // EVENT LISTENERS
        // ============================================================================
        document.getElementById("run-btn").addEventListener("click", async () => {
            if (!isPyodideReady) return;
            await runPythonCode();
        });

        document.getElementById("clear-console").addEventListener("click", () => {
            clearConsole();
        });

        document.getElementById("submit-btn").addEventListener("click", async () => {
            if (!isPyodideReady) {
                appendToConsole("\n[Warning]: Please wait for the Python environment to finish loading.");
                return;
            }

            const chapter = curriculum[currentChapterIndex];
            const output = await runPythonCode();

            const cleanOutput = output.trim().replace(/\r\n/g, '\n');
            const expected = chapter.expectedOutput.trim().replace(/\r\n/g, '\n');

            if (cleanOutput === expected) {
                appendToConsole("\n\n✅ SUCCESS! Output matches expected result.");

                if (!completedChapters.includes(chapter.id)) {
                    completedChapters.push(chapter.id);
                    localStorage.setItem('pythonUltimateProgress', JSON.stringify(completedChapters));
                }

                renderSidebar();

                if (currentChapterIndex + 1 < curriculum.length) {
                    setTimeout(() => {
                        alert("🎉 Correct! Chapter completed. Moving to next chapter.");
                        loadChapter(currentChapterIndex + 1);
                    }, 500);
                } else {
                    setTimeout(() => {
                        alert("🏆 CONGRATULATIONS! You have completed the entire Ultimate Python Handbook!");
                    }, 500);
                }
            } else {
                appendToConsole("\n\n❌ ERROR: Output does not match the expected result. Try again!");
                appendToConsole(`\nExpected: "${expected}"`);
                appendToConsole(`\nGot:      "${cleanOutput}"`);
            }
        });

        document.getElementById("reset-btn").addEventListener("click", () => {
            if (confirm("Are you sure you want to reset all your progress?")) {
                completedChapters = [];
                localStorage.removeItem('pythonUltimateProgress');
                loadChapter(0);
            }
        });
    </script>
</body>
</html>
